name: test-and-deploy

# ★ 2026-08-28 (พี่เต้เคาะ): push เข้า main = รันเทสอย่างเดียว · deploy ต้องสั่งด้วยมือเท่านั้น
#   เดิม push แล้ว deploy ขึ้น Cloudflare production อัตโนมัติ ซึ่งขัดกติกาบ้านข้อ
#   "อนุมัติดีไซน์ ≠ อนุมัติปล่อยจริง" — การปล่อยต้องมีคำสั่งของมันเองเสมอ
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'พิมพ์ deploy เพื่อยืนยันว่าจะปล่อยขึ้น production จริง'
        required: true
        default: 'no'

permissions:
  contents: read

concurrency:
  group: aim-ingest-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ★ 2026-08-28: no-floating-promises กัน promise ที่ถูกทิ้ง และ
      #   no-misused-promises กัน canView() ที่ลืม await แล้วถูกใช้เป็น boolean
      #   (ลืมครั้งเดียว = สิทธิ์การมองเห็นรั่วทั้งระบบ) ⇒ กฎที่ไม่มีตัวบังคับใช้ = ไม่มีกฎ
      - run: npm run lint
      - run: npm run db:migration:check

  deploy:
    needs: test
    # ปล่อยจริงเมื่อคนกดสั่งเองและพิมพ์ยืนยันว่า deploy เท่านั้น — push เฉย ๆ ไม่ปล่อย
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render ignored Wrangler configuration
        run: npm run cf:config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy aim-ingest
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
