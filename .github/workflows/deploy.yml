name: test-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aim-ingest-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ★ 2026-08-28: เพิ่ม lint เข้า CI — เดิมไม่มี ทั้งที่ commit d79ccee ตั้งกฎ
      #   @typescript-eslint/no-floating-promises ไว้กัน canView() ลืม await โดยเฉพาะ
      #   (ลืมครั้งเดียว = สิทธิ์การมองเห็นรั่วทั้งระบบ) ⇒ กฎที่ไม่มีตัวบังคับใช้ = ไม่มีกฎ
      - run: npm run lint
      - run: npm run db:migration:check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render ignored Wrangler configuration
        run: npm run cf:config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy aim-ingest
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
